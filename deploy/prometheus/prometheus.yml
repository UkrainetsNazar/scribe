global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: ws
    static_configs: [{ targets: ["ws:8000"] }]
  - job_name: relay
    static_configs: [{ targets: ["relay:9101"] }]
  - job_name: consumer
    static_configs: [{ targets: ["consumer:9102"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9103"] }]
  - job_name: rabbitmq
    # Per-queue metrics (the default endpoint only has totals)
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: traefik
    static_configs: [{ targets: ["traefik:8080"] }]
