name: scribe

x-app-env: &app-env
  APP_ENV: local
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
  DATABASE_URL: postgresql+asyncpg://scribe:scribe@postgres:5432/scribe
  MONGO_URL: mongodb://mongo:27017
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://scribe:scribe@rabbitmq:5672/
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: localhost:9100
  TRANSCRIBER: ${TRANSCRIBER:-stub}
  OTLP_ENDPOINT: http://jaeger:4318
  WEBHOOK_ALLOW_PRIVATE_NETWORKS: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
      POSTGRES_DB: scribe
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe -d scribe"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: scribe
      RABBITMQ_DEFAULT_PASS: scribe
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes:
      - rabbit_data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: scribe
      MINIO_ROOT_PASSWORD: scribe-secret
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes: [minio_data:/data]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  relay:
    build: .
    command: ["python", "-m", "scribe.workers.relay"]
    environment:
      <<: *app-env
      SERVICE_NAME: scribe-relay
      METRICS_PORT: "9101"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  consumer:
    build: .
    command: ["python", "-m", "scribe.workers.consumer"]
    environment:
      <<: *app-env
      SERVICE_NAME: scribe-consumer
      METRICS_PORT: "9102"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      minio: { condition: service_started }
    
  worker:
    build:
      context: .
      args:
        EXTRAS: "--extra whisper"
    command:
      - sh
      - -c
      # A clean multiprocess metrics directory on every start, then Celery
      - >-
        rm -rf "$$PROMETHEUS_MULTIPROC_DIR" && mkdir -p "$$PROMETHEUS_MULTIPROC_DIR"
        && exec celery -A scribe.workers.pipeline_tasks:celery_app worker
        -Q celery.pipeline --concurrency=2 --loglevel=INFO
    environment:
      <<: *app-env
      SERVICE_NAME: scribe-worker
      METRICS_PORT: "9103"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
    volumes: [whisper_models:/root/.cache/huggingface]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  api:
    build: .
    environment:
      <<: *app-env
      APP_ROLE: api
      SERVICE_NAME: scribe-api
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  ws:
    build: .
    command:
      - uvicorn
      - scribe.presentation.app:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --no-access-log  # the WebSocket token is in the query string: never write it to logs
    environment:
      <<: *app-env
      APP_ROLE: ws
      SERVICE_NAME: scribe-ws
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  traefik:
    image: traefik:v3.3
    ports:
      - "127.0.0.1:8010:8000"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/traefik:/etc/traefik:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api: { condition: service_started }
      ws: { condition: service_started }
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports: ["127.0.0.1:16686:16686"]  # UI; OTLP (4318) stays inside the network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # development: dashboards are visible without a login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: ["127.0.0.1:3030:3000"]  # 3000 is left free for a frontend
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }
      jaeger: { condition: service_started }
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
  rabbit_data:
  minio_data:
  whisper_models:
  prometheus_data:
  grafana_data: