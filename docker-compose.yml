name: scribe

x-app-env: &app-env
  APP_ENV: local
  DATABASE_URL: postgresql+asyncpg://scribe:scribe@postgres:5432/scribe
  MONGO_URL: mongodb://mongo:27017
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://scribe:scribe@rabbitmq:5672/
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: localhost:9100
  TRANSCRIBER: ${TRANSCRIBER:-stub}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
      POSTGRES_DB: scribe
    ports: ["5433:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe -d scribe"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: scribe
      RABBITMQ_DEFAULT_PASS: scribe
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbit_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: scribe
      MINIO_ROOT_PASSWORD: scribe-secret
    ports: ["9100:9000", "9101:9001"]
    volumes: [minio_data:/data]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  relay:
    build: .
    command: ["python", "-m", "scribe.workers.relay"]
    environment: *app-env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  consumer:
    build: .
    command: ["python", "-m", "scribe.workers.consumer"]
    environment: *app-env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    
  worker:
    build:
      context: .
      args:
        EXTRAS: "--extra whisper"
    command:
      [
        "celery", "-A", "scribe.workers.pipeline_tasks:celery_app",
        "worker", "-Q", "celery.pipeline", "--concurrency=2", "--loglevel=INFO",
      ]
    environment: *app-env
    volumes: [whisper_models:/root/.cache/huggingface]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  api:
    build: .
    environment:
      <<: *app-env
      APP_ROLE: api
    # No published ports: external traffic goes through the gateway
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  ws:
    build: .
    command:
      - uvicorn
      - scribe.presentation.app:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --no-access-log  # the WebSocket token is in the query string: never write it to logs
    environment:
      <<: *app-env
      APP_ROLE: ws
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  traefik:
    image: traefik:v3.3
    ports:
      - "8010:8000"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/traefik:/etc/traefik:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api: { condition: service_started }
      ws: { condition: service_started }
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
  rabbit_data:
  minio_data:
  whisper_models: